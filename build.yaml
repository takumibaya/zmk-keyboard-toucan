# Debug build of the left half only (branch feat/touch-gestures-debug): rim scroll
# diagnostics over USB serial logging (CDC ACM); Studio over Bluetooth. INF log level keeps
# ZMK's per-event debug output off so logging does not disturb the cursor.
---
include:
  - board: seeeduino_xiao_ble
    shield: toucan_left nice_view_gem
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_TOUCAN_TOUCH_GESTURES_LOG_RIM=y
    artifact-name: toucan_left_rim_debug
